<html lang="en">

<head>

    <title>Parashat HaShavua | Jewmaica – The Living Archive of Jewish Jamaica</title>

    <!-- Main Jewmaica stylesheet -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

        rel="stylesheet"
    >


    <style>

        /* =========================================================
           JEWMAICA ABOUT PAGE
           ========================================================= */

        :root {

            --jw-green: #003b2a;
            --jw-dark-green: #00281d;
            --jw-deep-green: #001f17;

            --jw-gold: #c79a28;
            --jw-light-gold: #e1b84c;

            --jw-mahogany: #4a2415;
            --jw-mahogany-light: #704029;

            --jw-parchment: #f2e7cf;
            --jw-parchment-dark: #dfcda8;

            --jw-cream: #faf7ee;

            --jw-text: #17382d;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: var(--jw-parchment);

            color: var(--jw-text);

            font-family:
                "EB Garamond",
                Georgia,
                serif;
        }


        a {
            text-decoration: none;
        }


        /* =========================================================
           TOP STRIP
           ========================================================= */

        .parasha-top-strip {

            background: var(--jw-deep-green);

            color: var(--jw-light-gold);

            border-bottom:
                1px solid rgba(199,154,40,0.45);

            padding: 8px 30px;

            text-align: center;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size: 13px;

            letter-spacing: 1.4px;
        }


        .parasha-top-strip span {

            margin: 0 12px;
        }


        /* =========================================================
           BRAND HEADER
           ========================================================= */

        .parasha-brand {

            background:
                linear-gradient(
                    rgba(0,59,42,0.95),
                    rgba(0,40,29,0.96)
                );

            min-height: 115px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 20px 5%;

            border-bottom:
                1px solid var(--jw-gold);
        }


        .brand-left {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        .brand-logo {

            width: 250px;

            max-width: 42vw;

            height: auto;
        }


        .menorah-mark {

            width: 75px;

            height: 75px;

            object-fit: contain;

            opacity: 0.20;
        }

        /* =========================================================
           PAGE HERO
           ========================================================= */
        
    <section class="page-hero">
        <h1>About Jewmaica</h1>
        <p>The Living Archive of Jewish Jamaica</p>
    </section>

    <section class="content-section">
        <h2>Our Story</h2>

        <p>
            Jewmaica was founded by Michael A. Nunes through study and learning with Rabbi Haim Ovadia of Torah Ve’Ahava (https://torahveahava.com/) and minyan leadership in tefillah at SephardicU (https://www.sephardicu.com).

            Jewmaica is dedicated to promoting the traditional values of Sephardic Judaism, extending the olive branch of the Torah verse, Vayikra 19:18, “Love your neighbor as yourself” – ואהבת לרעך כמוך. 

            Through a deep commitment to Torah observance, Jewmaica seeks to express these values in our actions, homes, and communal engagement. It is also focused on outreach to the Jamaican community, fostering loving understanding while upholding strong Torah values, as well as supporting the State of Israel and promoting safety and understanding for Jews everywhere.

            
        </p>
