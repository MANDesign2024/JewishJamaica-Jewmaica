<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Jewmaica | The Living Archive of Jewish Jamaica</title>

    <!-- Main Jewmaica stylesheet -->
    <link rel="stylesheet" href="../style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           JEWMAICA CONTACT PAGE
           The Living Archive of Jewish Jamaica
           ========================================================= */


        :root {

            --jw-green: #003b2a;
            --jw-dark-green: #00281d;
            --jw-deep-green: #001f17;

            --jw-gold: #c79a28;
            --jw-light-gold: #e1b84c;

            --jw-mahogany: #4a2415;
            --jw-mahogany-light: #704029;

            --jw-parchment: #f2e7cf;
            --jw-parchment-dark: #dfcda8;

            --jw-cream: #faf7ee;

            --jw-text: #17382d;
        }


        /* =========================================================
           GLOBAL
           ========================================================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: var(--jw-parchment);

            color: var(--jw-text);

            font-family:
                "EB Garamond",
                Georgia,
                serif;
        }


        a {
            text-decoration: none;
        }


        /* =========================================================
           TOP STRIP
           ========================================================= */

        .about-top-strip {

            background: var(--jw-deep-green);

            color: var(--jw-light-gold);

            border-bottom:
                1px solid rgba(199,154,40,0.45);

            padding: 8px 30px;

            text-align: center;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size: 13px;

            letter-spacing: 1.4px;
        }


        .about-top-strip span {

            margin: 0 12px;
        }


        /* =========================================================
           BRAND HEADER
           ========================================================= */

        .about-brand {

            background:
                linear-gradient(
                    rgba(0,59,42,0.95),
                    rgba(0,40,29,0.96)
                );

            min-height: 115px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 20px 5%;

            border-bottom:
                1px solid var(--jw-gold);
        }


        .about-brand-left {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        .about-brand-logo {

            width: 250px;

            max-width: 42vw;

            height: auto;
        }


        .about-menorah-mark {

            width: 75px;

            height: 75px;

            object-fit: contain;

            opacity: 0.20;
        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        .about-nav {

            background: var(--jw-mahogany);

            border-bottom:
                2px solid var(--jw-gold);

            display: flex;

            justify-content: center;

            flex-wrap: wrap;
        }


        .about-nav a {

            color: #fff7df;

            padding: 14px 18px;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size: 13px;

            letter-spacing: 0.6px;

            transition: 0.25s ease;
        }


        .about-nav a:hover,
        .about-nav a.active {

            color: var(--jw-light-gold);

            background:
                rgba(0,0,0,0.18);
        }


        /* =========================================================
           BREADCRUMB
           ========================================================= */

        .about-breadcrumb {

            max-width: 1280px;

            margin: 0 auto;

            padding: 18px 25px 8px;

            color: #6b5a40;

            font-size: 15px;
        }


        .about-breadcrumb a {

            color: var(--jw-green);
        }


        /* =========================================================
           MAIN WRAPPER
           ========================================================= */

        .about-wrapper {

            max-width: 1280px;

            margin: auto;

            padding: 10px 25px 45px;
        }


        /* =========================================================
           ABOUT HERO
           ========================================================= */

        .about-hero {

            min-height: 300px;

            background:

                linear-gradient(
                    90deg,

                    rgba(242,231,207,1.00) 0%,

                    rgba(242,231,207,0.97) 38%,

                    rgba(242,231,207,0.82) 52%,

                    rgba(242,231,207,0.30) 72%,

                    rgba(242,231,207,0.05) 100%
                ),

                url("../assets/images/parasha-hero.jpg")
                center center / cover
                no-repeat;

            border:
                1px solid #c7b78f;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.12);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 35px;
        }


        .about-hero-overlay {

            max-width: 900px;

            width: 100%;
        }


        .about-hero-small-title {

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size: 20px;

            letter-spacing: 6px;

            color: var(--jw-green);

            margin-bottom: 8px;
        }


        .about-hero h1 {

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size:
                clamp(46px, 7vw, 76px);

            line-height: 1;

            color: var(--jw-green);

            margin: 5px 0 15px;

            letter-spacing: 2px;
        }


        .about-hero-subtitle {

            font-size: 29px;

            font-style: italic;

            color: #704a28;

            margin-bottom: 18px;
        }


        .about-ornament {

            color: var(--jw-gold);

            font-size: 27px;

            letter-spacing: 8px;
        }


        /* =========================================================
           INTRODUCTION
           ========================================================= */

        .contact-introduction {

            margin-top: 20px;

            background: var(--jw-cream);

            border:
                1px solid #d8c9aa;

            box-shadow:
                0 4px 12px rgba(49,37,22,0.10);

            padding: 35px 45px;

            text-align: center;
        }


        .contact-introduction h2 {

            margin: 0 0 15px;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            color: var(--jw-green);

            font-size: 28px;

            letter-spacing: 1px;
        }


        .contact-introduction .intro-rule {

            color: var(--jw-gold);

            font-size: 20px;

            margin-bottom: 18px;
        }


        .contact-introduction p {

            max-width: 900px;

            margin:
                0 auto;

            font-size: 21px;

            line-height: 1.55;
        }


        /* =========================================================
           MAIN ABOUT GRID
           ========================================================= */

        .contact-main-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 2fr)
                minmax(280px, 1fr);

            gap: 20px;

            margin-top: 20px;

            align-items: start;
        }


        /* =========================================================
           CONTENT CARD
           ========================================================= */

        .contact-card {

            background: var(--jw-cream);

            border:
                1px solid #d8c9aa;

            box-shadow:
                0 4px 12px rgba(49,37,22,0.10);
        }


        .contact-card-heading {

            background: var(--jw-green);

            color: #fff9e9;

            padding: 15px 20px;

            text-align: center;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size: 18px;

            letter-spacing: 0.8px;
        }


        .contact-card-body {

            padding: 30px 35px;
        }


        .contact-card-body h2 {

            margin:
                0 0 15px;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            color: var(--jw-green);

            font-size: 30px;
        }


        .contact-card-body h3 {

            margin:
                25px 0 8px;

            font-family:
                "Cinzel",
                Georgia,
                serif;

            color: var(--jw-mahogany);

            font-size: 21px;
        }


        .contact-card-body p {

            font-size: 19px;

            line-height: 1.55;

            margin:
                0 0 18px;
        }


        .contact-card-body p:last-child {

            margin-bottom: 0;
        }


       
        /* =========================================================
           FOOTER QUOTE
           ========================================================= */

        .about-footer-quote {

            margin-top: 25px;

            background:

                linear-gradient(
                    rgba(0,45,32,0.95),
                    rgba(0,35,25,0.96)
                );

            color: white;

            padding: 30px 25px;

            text-align: center;

            border-top:
                2px solid var(--jw-gold);

            border-bottom:
                2px solid var(--jw-gold);
        }


        .about-footer-quote blockquote {

            max-width: 900px;

            margin: auto;

            font-size: 22px;

            font-style: italic;

            line-height: 1.5;
        }


        .about-footer-source {

            display: block;

            margin-top: 12px;

            color: var(--jw-light-gold);

            font-family:
                "Cinzel",
                Georgia,
                serif;

            font-size: 14px;
        }


       
    <!-- =========================================================
         TOP STRIP
         ========================================================= -->

    <div class="about-top-strip">

        PRESERVING THE PAST

        <span>•</span>

        STRENGTHENING THE PRESENT

        <span>•</span>

        BUILDING THE FUTURE

    </div>


    <!-- =========================================================
         BRAND HEADER
         ========================================================= -->

    <header class="contact-brand">

        <div class="contact-brand-left">

            <img
                src="../assets/images/logo.png"
                alt="Jewmaica – The Living Archive of Jewish Jamaica"
                class="contact-brand-logo"
            >


            <img
                src="../assets/images/menorah.jpg"
                alt=""
                class="about-menorah-mark"
            >

        </div>

    </header>


    <!-- =========================================================
         NAVIGATION
         ========================================================= -->

    <nav class="about-nav">

        <a href="../index.html">
            HOME
        </a>

        <a href="torah.html">
            TORAH
        </a>

        <a href="#">
            LIVING ARCHIVE
        </a>

        <a href="#">
            JEWISH JAMAICA
        </a>

        <a href="#">

        </a>

        <a href="#">
            MEDIA
        </a>

        <a href="calendar.html">
            CALENDAR
        </a>

        <a href="#">
            COMMUNITY
        </a>

        <a href="about.html" class="active">
            ABOUT
        </a>

        <a href="#">
            CONTACT
        </a>

    </nav>


    <!-- =========================================================
         BREADCRUMB
         ========================================================= -->

    <div class="about-breadcrumb">

        <a href="../index.html">
            ⌂ Home
        </a>

        <span> › </span>

        <strong>
            About Jewmaica
        </strong>

    </div>


    <!-- =========================================================
         MAIN PAGE
         ========================================================= -->

    <main class="about-wrapper">


        <!-- =====================================================
             ABOUT HERO
             ===================================================== -->

        <section class="about-hero">

            <div class="about-hero-overlay">

                <div class="about-hero-small-title">
                    ABOUT
                </div>


                <h1>
                    JEWMAICA
                </h1>


                <div class="about-hero-subtitle">
                    The Living Archive of Jewish Jamaica
                </div>


                <div class="about-ornament">
                    ─── ❖ ───
                </div>

            </div>

        </section>


        <!-- =====================================================
             INTRODUCTION
             ===================================================== -->

        <section class="about-introduction">

            <h2>
                Preserving a Living Story
            </h2>


            <div class="intro-rule">
                ❖
            </div>


            <p>
                Contact Us at P.O. Box XX
            </p>

        </section>


        
        <!-- =====================================================
             FOOTER QUOTE
             ===================================================== -->

        <section class="about-footer-quote">

            <blockquote>

                “Love your neighbor as yourself.”

            </blockquote>


            <span class="about-footer-source">

                וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ
                — Vayikra (Leviticus) 19:18

            </span>

        </section>


    </main>


</body>

</html>
